name: Auto release

on:
  push:
    tags: 
      - v*
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Install pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10
          run_install: false

      - name: Install node
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: 'pnpm'
      - run: pnpm i
      - run: node scripts/getChangeLog.mjs > CHANGELOG.txt
      - name: Start build
        run: pnpm run build
      - name: Archive dist
        run: pnpm run archive
      # Tag pushes already have a tag ref. Manual workflow_dispatch runs on a
      # branch, so action-gh-release needs an explicit tag (v<package.json version>).
      - name: Resolve release tag
        id: release_tag
        shell: bash
        run: |
          if [[ "${GITHUB_REF}" == refs/tags/* ]]; then
            echo "name=${GITHUB_REF_NAME}" >> "$GITHUB_OUTPUT"
          else
            version="$(node -p "require('./package.json').version")"
            echo "name=v${version}" >> "$GITHUB_OUTPUT"
          fi
      - name: Github release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.release_tag.outputs.name }}
          files: |
            build/*.zip
            metafile-*.json
          token: ${{ secrets.GITHUB_TOKEN }}
          body_path: CHANGELOG.txt