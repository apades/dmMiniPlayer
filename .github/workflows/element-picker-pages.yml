name: Deploy element-picker playground

on:
  push:
    branches: [main, master]
    paths:
      - 'packages/element-picker/**'
      - '.github/workflows/element-picker-pages.yml'
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: element-picker-pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: pnpm/action-setup@v4
        with:
          version: 10
      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm
      - run: pnpm install
      - run: pnpm --filter @apad/element-picker playground:build
      - uses: actions/upload-pages-artifact@v3
        with:
          path: packages/element-picker/playground/dist
      - id: deployment
        uses: actions/deploy-pages@v4
